# Noms d'hôte acceptés. Protège contre le « DNS rebinding » : une page web piégée ne peut pas
# se faire passer pour localhost et lire l'API. Pour un autre nom (serveur interne), l'ajouter ici.
map $host $orgchart_host_ok {
    default                                0;
    "~^(localhost|127\.0\.0\.1|\[::1\])$"  1;
    frontend                               1;   # nom du service dans Docker (tests make e2e-docker)
}

server {
    # port non privilégié : nginx tourne sans les droits root (image nginx-unprivileged)
    listen 8080;
    server_name _;
    if ($orgchart_host_ok = 0) {
        return 421;
    }
    # redirections relatives : correctes quel que soit le port publié par Docker (8080, 8081…)
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Les imports Excel peuvent dépasser la limite par défaut (1 Mo). Pas de version d'nginx exposée.
    client_max_body_size 20m;
    server_tokens off;

    # Sécurité : le navigateur n'a le droit de charger que des ressources
    # de la même origine (aucun CDN, aucune police ou script distant).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Documentation de l'API (Swagger UI embarqué, aucun CDN)
    location = /api/docs { return 302 /api-docs/; }

    # API -> backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Application monopage
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
